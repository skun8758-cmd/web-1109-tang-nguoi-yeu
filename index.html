<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #fde2e4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. Màn hình nhập Passcode */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.15);
            text-align: center;
            width: 320px;
            z-index: 10;
        }
        .card h2 { color: #ff4d6d; margin-bottom: 20px; font-size: 1.5rem; }
        
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }
        .dot {
            width: 14px;
            height: 14px;
            border: 2px solid #ff4d6d;
            border-radius: 50%;
            transition: 0.2s;
        }
        .dot.active { background-color: #ff4d6d; }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .key-btn {
            background: #fff;
            border: 1px solid #ffe5ec;
            border-radius: 14px;
            padding: 14px;
            font-size: 1.2rem;
            color: #444;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.15s;
        }
        .key-btn:active { transform: scale(0.92); background: #ffe5ec; }

        /* 2. Màn hình Bó hoa / Ảnh kỷ niệm */
        .flower-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            cursor: pointer;
            animation: fadeIn 0.8s ease-in-out;
        }
        .flower-img {
            max-width: 300px;
            width: 85%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            
            /* Hiệu ứng bay qua lại đung đưa (4 giây lặp lại vô tận) */
            animation: swingFly 4s ease-in-out infinite;
            transition: transform 0.3s;
        }
        .flower-img:hover { 
            /* Phóng to nhẹ khi rê chuột hoặc chạm vào */
            transform: scale(1.05); 
        }
        .flower-hint {
            margin-top: 20px;
            color: #ff4d6d;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* 3. Khung hiển thị Lời chúc (Modal) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 24px;
            max-width: 380px;
            width: 85%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: popIn 0.3s ease-out;
        }
        .modal-box h3 { color: #ff4d6d; margin-bottom: 15px; font-size: 1.4rem; }
        .modal-box p { color: #555; line-height: 1.6; margin-bottom: 20px; font-size: 1rem; }
        .close-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Keyframes định nghĩa chuyển động bay đung đưa */
        @keyframes swingFly {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(-10px, -5px) rotate(-3deg);
            }
            50% {
                transform: translate(0, -10px) rotate(0deg);
            }
            75% {
                transform: translate(10px, -5px) rotate(3deg);
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Thẻ phát nhạc ẩn (file nhạc đặt trong thư mục static) -->
    <audio id="bgMusic" src="{{ url_for('static', filename='music.mp3') }}" loop></audio>

    <!-- Màn hình 1: Nhập Passcode -->
    <div class="card" id="passCard">
        <h2>Nhập pass nha</h2>
        <div class="dots-container">
            <div class="dot" id="dot0"></div>
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
        </div>
        <div class="keypad">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <div></div>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn" onclick="deleteKey()" style="color: #ff4d6d;">✕</button>
        </div>
    </div>

    <!-- Màn hình 2: Bó Hoa / Ảnh kỷ niệm -->
    <div class="flower-screen" id="flowerScreen" onclick="showModal()">
        <!-- Load hình ảnh từ thư mục static -->
        <img src="{{ url_for('static', filename='ky_niem.jpg') }}" alt="Kỷ niệm hai ta" class="flower-img">
        <div class="flower-hint">Chạm vào ảnh nhé 🌷</div>
    </div>

    <!-- Màn hình 3: Lời Chúc -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3 id="modalTitle"></h3>
            <p id="modalMsg"></p>
            <button class="close-btn" onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script>
        let currentPass = "";
        let greetingData = {};

        function id(name) { return document.getElementById(name); }

        function pressKey(num) {
            if (currentPass.length < 4) {
                currentPass += num;
                updateDots();
                if (currentPass.length === 4) {
                    verifyPasscode();
                }
            }
        }

        function deleteKey() {
            currentPass = currentPass.slice(0, -1);
            updateDots();
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                if (i < currentPass.length) id('dot' + i).classList.add('active');
                else id('dot' + i).classList.remove('active');
            }
        }

        function verifyPasscode() {
            fetch('/kiem-tra-pass', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ passcode: currentPass })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    greetingData = data;
                    id('passCard').style.display = 'none';
                    id('flowerScreen').style.display = 'flex';
                    
                    // Tự động phát nhạc khi nhập pass đúng
                    playMusic();
                } else {
                    alert(data.message);
                    currentPass = "";
                    updateDots();
                }
            });
        }

        function playMusic() {
            let music = id('bgMusic');
            if (music) {
                music.play().catch(error => {
                    console.log("Trình duyệt chặn tự động phát nhạc:", error);
                });
            }
        }

        function showModal() {
            id('modalTitle').innerText = greetingData.tieu_de;
            id('modalMsg').innerText = greetingData.loi_chuc;
            id('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            id('modalOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
